name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pwa:
    name: Lint + Build + Test (PWA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  drift-check:
    name: Category drift (UI vs webhook.gs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Verifica que CATEGORIES (config.ts) y ALLOWED_CATEGORIES/detectCategory (webhook.gs)
      # estén alineadas. El drift de "Bre-B" (asignada por el campo Tipo, no por
      # detectCategory) ya está reconciliado — ver ALLOWED_CATEGORIES y migrateCategories()
      # en webhook.gs — así que este check ahora bloquea el merge si hay drift nuevo.
      - name: Check category drift
        run: node scripts/check-category-drift.mjs
